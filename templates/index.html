<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home – VulnApp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 1.4rem; letter-spacing: 1px; }
        header nav a {
            color: #a0c4ff;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.95rem;
        }
        header nav a:hover { text-decoration: underline; }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }
        .hero {
            text-align: center;
            max-width: 600px;
        }
        .hero h2 {
            font-size: 2.2rem;
            color: #1a1a2e;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.05rem;
            color: #555;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #1a1a2e;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #16213e; }
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <header>
        <h1>VulnApp</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/login">Sign In</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h2>Welcome to VulnApp</h2>
            <p>
                This is a deliberately vulnerable web application built for security
                research and education. It demonstrates common web vulnerabilities
                such as SQL injection.
            </p>
            <a href="/login" class="btn">Sign In</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 VulnApp – For educational purposes only.</p>
    </footer>
</body>
</html>
