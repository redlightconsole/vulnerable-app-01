<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – VulnApp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 1.4rem; letter-spacing: 1px; }
        header nav a {
            color: #a0c4ff;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.95rem;
        }
        header nav a:hover { text-decoration: underline; }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
        }
        .card h2 {
            font-size: 1.6rem;
            color: #1a1a2e;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #444;
        }
        .form-group input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #1a1a2e; }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a2e;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        .btn:hover { background: #16213e; }
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 4px;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }
        .alert-error {
            background: #fdecea;
            color: #b00020;
            border: 1px solid #f5c6cb;
        }
        .alert-success {
            background: #e6f4ea;
            color: #1e6e2e;
            border: 1px solid #b7dfbe;
        }
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <header>
        <h1>VulnApp</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/login">Sign In</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h2>Sign In</h2>

            {{if .Error}}
            <div class="alert alert-error">{{.Error}}</div>
            {{end}}

            {{if .Success}}
            <div class="alert alert-success">{{.Success}}</div>
            {{end}}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 VulnApp – For educational purposes only.</p>
    </footer>
</body>
</html>
